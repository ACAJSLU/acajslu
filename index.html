<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag essencial para garantir que o site seja responsivo em celulares e tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAJ SLU</title>
    <style>
        body {
            background-color: #f4f4f6; /* Cor de fundo cinza bem claro */
            font-family: 'Cambria', Georgia, serif; /* Fonte Cambria */
            color: #333333; /* Cor do texto principal */
            margin: 0;
            padding: 20px; /* Espaçamento de segurança nas bordas em telas pequenas */
            box-sizing: border-box;
        }

        /* Área superior com logotipo e título marca alinhados lado a lado à esquerda */
        .top-bar {
            width: 100%;
            display: flex;
            align-items: center; /* Alinha o texto na altura do meio do logotipo */
            gap: 16px; /* Espaçamento entre o logotipo e o título marca */
            margin-bottom: 40px;
        }

        .logo {
            width: 80px; /* Largura padrão do logotipo */
            height: auto;
            flex-shrink: 0; /* Impede a imagem de encolher em telas menores */
        }

        /* Título da marca posicionado ao lado do logotipo */
        .brand-title {
            color: #111111;
            font-size: clamp(20px, 3.5vw, 28px); /* Ajuste de fonte responsivo */
            margin: 0;
            line-height: 1.2;
        }

        /* Bloco principal centralizado para a mensagem institucional */
        .main-content {
            max-width: 800px; /* Limita a largura em telas grandes para manter uma boa leitura */
            margin: 0 auto;   /* Centraliza o bloco na tela na horizontal */
            text-align: center; /* Centraliza o parágrafo descritivo */
            padding: 20px 10px;
        }

        p {
            font-size: clamp(16px, 2.5vw, 22px); /* Tamanho fluido: confortável no celular e no PC */
            line-height: 1.6;
            margin: 0;
        }

        /* Ajustes específicos para telas de smartphones */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .top-bar {
                gap: 12px;
                margin-bottom: 25px;
            }

            .logo {
                width: 55px; /* Reduz levemente o logo em telas de celulares */
            }
        }
    </style>
</head>
<body>

    <!-- Cabeçalho com o logotipo e o título da marca alinhados à esquerda -->
    <header class="top-bar">
        <img src="Logotipo - ACAJ.png" alt="Logotipo ACAJ SLU" class="logo">
        <h1 class="brand-title">ACAJ - Sociedade Limitada Unipessoal</h1>
    </header>

    <!-- Conteúdo principal centralizado -->
    <main class="main-content">
        <p>O mundo dos negócios é um ecossistema vivo, onde oportunidade, estruturação e confiança operam em sintonia. Nossa inteligência nasce de uma leitura estratégica e profunda do mercado.</p>
    </main>

</body>
</html>
