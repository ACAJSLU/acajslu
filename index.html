<script>
    async function carregarGoogleNoticias() {
        // Feed em RSS do Google Notícias
        const rssUrl = 'https://news.google.com/rss?hl=pt-BR&gl=BR&ceid=BR:pt-419';
        // Utilizando o proxy AllOrigins para contornar problemas de CORS
        const apiUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;

        try {
            const resposta = await fetch(apiUrl);
            if (!resposta.ok) throw new Error('Falha na resposta da rede');
            
            const dados = await resposta.json();
            
            // Converte a string XML contida em dados.contents em documento DOM
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(dados.contents, "text/xml");
            const itens = xmlDoc.querySelectorAll("item");

            const ul = document.getElementById('lista-noticias');
            ul.innerHTML = ''; // Limpa mensagem de carregamento

            if (itens.length === 0) {
                ul.innerHTML = '<li>Nenhuma notícia encontrada.</li>';
                return;
            }

            // Exibe as 5 primeiras notícias do feed RSS
            Array.from(itens).slice(0, 5).forEach(item => {
                const li = document.createElement('li');
                
                const link = document.createElement('a');
                link.href = item.querySelector("link") ? item.querySelector("link").textContent : '#';
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = item.querySelector("title") ? item.querySelector("title").textContent : 'Sem título';

                const pubDateText = item.querySelector("pubDate") ? item.querySelector("pubDate").textContent : null;
                const data = document.createElement('span');
                data.className = 'noticia-data';
                
                if (pubDateText) {
                    const dataObj = new Date(pubDateText);
                    data.textContent = dataObj.toLocaleDateString('pt-BR', {
                        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                    });
                }

                li.appendChild(link);
                li.appendChild(data);
                ul.appendChild(li);
            });

        } catch (erro) {
            console.error("Erro ao carregar notícias:", erro);
            document.getElementById('lista-noticias').innerHTML = '<li>Erro ao carregar notícias.</li>';
        }
    }

    carregarGoogleNoticias();
</script>
