<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag essencial para garantir que o site seja responsivo em celulares e tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAJ SLU</title>
    <style>
        body {
            background-color: #f4f4f6; /* Cor de fundo cinza bem claro */
            font-family: 'Cambria', Georgia, serif; /* Fonte Cambria */
            color: #333333; /* Cor do texto principal */
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Faixa de cor no topo que vai de ponta a ponta da tela */
        .top-bar {
            width: 100%;
            background-color: #1e293b; /* Cor da faixa: Azul-marinho escuro/corporativo */
            padding: 15px 30px; /* Espaço interno para respirar */
            display: flex;
            align-items: center; /* Alinha verticalmente o logo e o texto ao centro */
            gap: 20px; /* Espaçamento entre o logotipo e o título */
            box-sizing: border-box;
            border-bottom: 3px solid #d4af37; /* Linha sutil dourada na base para dar acabamento */
        }

        .logo {
            width: 60px; /* Largura proporcional para o logo dentro da faixa */
            height: auto;
            flex-shrink: 0; /* Impede que a imagem encolha em telas muito pequenas */
        }

        /* Título da marca dentro da faixa escura */
        .brand-title {
            color: #ffffff; /* Letra branca para alto contraste */
            font-size: clamp(18px, 3vw, 26px); /* Ajuste de tamanho dinâmico */
            font-weight: normal;
            margin: 0;
            line-height: 1.2;
        }

        /* Destaque em dourado para a segunda parte do título */
        .brand-title span {
            color: #f1c40f; /* Cor dourada para harmonizar com o logotipo */
        }

        /* Bloco principal centralizado para a mensagem institucional */
        .main-content {
            max-width: 800px; /* Limita a largura para melhor leitura em PCs */
            margin: 60px auto;   /* Centraliza horizontalmente e dá espaço da faixa */
            text-align: center; /* Centraliza o parágrafo */
            padding: 0 20px; /* Margem de segurança nas laterais */
        }

        p {
            font-size: clamp(18px, 2.8vw, 22px); /* Confortável em celulares e computadores */
            line-height: 1.6;
            margin: 0;
        }

        /* Ajustes de responsividade para celulares */
        @media (max-width: 600px) {
            .top-bar {
                padding: 10px 15px; /* Reduz margens no mobile */
                gap: 12px;
            }

            .logo {
                width: 45px; /* Reduz logo para não esmagar em telas pequenas */
            }

            .main-content {
                margin: 40px auto; /* Reduz espaçamento do topo em telas pequenas */
            }
        }
    </style>
</head>
<body>

    <!-- Faixa de cabeçalho escura com o logotipo e o título da marca -->
    <header class="top-bar">
        <img src="Logotipo - ACAJ.png" alt="Logotipo ACAJ SLU" class="logo">
        <h1 class="brand-title">ACAJ - <span>Sociedade Limitada Unipessoal</span></h1>
    </header>

    <!-- Conteúdo principal centralizado -->
    <main class="main-content">
        <p>O mundo dos negócios é um ecossistema vivo, onde oportunidade, estruturação e confiança operam em sintonia. Nossa inteligência nasce de uma leitura estratégica e profunda do mercado.</p>
    </main>

</body>
</html>
