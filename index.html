<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag essencial para garantir que o site seja responsivo em celulares e tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAJ SLU</title>
    <style>
        body {
            background-color: #f4f4f6; /* Cor de fundo cinza bem claro */
            font-family: 'Cambria', Georgia, serif; /* Fonte Cambria */
            color: #333333; /* Cor do texto principal */
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Faixa de cor principal no topo */
        .top-bar {
            width: 100%;
            background-color: #1e293b; /* Azul-marinho escuro */
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-sizing: border-box;
            border-bottom: 3px solid #d4af37; /* Linha dourada separadora */
        }

        .logo {
            width: 60px;
            height: auto;
            flex-shrink: 0;
        }

        /* Título da marca dentro da faixa escura */
        .brand-title {
            color: #ffffff;
            font-size: clamp(18px, 3vw, 26px);
            font-weight: normal;
            margin: 0;
            line-height: 1.2;
        }

        .brand-title span {
            color: #f1c40f;
        }

        /* Segunda faixa: Reservada para o futuro menu de navegação */
        .nav-bar {
            width: 100%;
            background-color: #334155; /* Tom complementar para o menu */
            padding: 12px 30px;
            box-sizing: border-box;
            border-bottom: 1px solid #cbd5e1;
        }

        .menu-placeholder {
            color: #e2e8f0;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0;
        }

        /* Bloco principal centralizado para a mensagem institucional */
        .main-content {
            max-width: 800px;
            margin: 50px auto;
            text-align: center;
            padding: 0 20px;
        }

        p {
            font-size: clamp(18px, 2.8vw, 22px);
            line-height: 1.6;
            margin: 0;
        }

        /* Ajustes de responsividade para celulares */
        @media (max-width: 600px) {
            .top-bar {
                padding: 10px 15px;
                gap: 12px;
            }

            .logo {
                width: 45px;
            }

            .nav-bar {
                padding: 10px 15px;
            }

            .main-content {
                margin: 35px auto;
            }
        }
    </style>
</head>
<body>

    <!-- Faixa de cabeçalho com o logotipo e título -->
    <header class="top-bar">
        <img src="Logotipo - ACAJ.png" alt="Logotipo ACAJ SLU" class="logo">
        <h1 class="brand-title">ACAJ - <span>Sociedade Limitada Unipessoal</span></h1>
    </header>

    <!-- Segunda faixa reservada para os menus futuros -->
    <nav class="nav-bar">
        <p class="menu-placeholder">Área reservada para o menu</p>
    </nav>

    <!-- Conteúdo principal centralizado -->
    <main class="main-content">
        <p>O mundo dos negócios é um ecossistema vivo, onde oportunidade, estruturação e confiança operam em sintonia. Nossa inteligência nasce de uma leitura estratégica e profunda do mercado.</p>
    </main>

</body>
</html>
